[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "microserve"
version = "0.0.1"
description = "A measurable LLM serving engine, built to learn serving internals."
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch",
    "transformers",
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "numpy",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "prometheus_client",  # tests parse render_prometheus() output with its text parser
]

[tool.hatch.build.targets.wheel]
packages = ["src/microserve"]

# --- torch: CUDA 12.8 wheels on x86-64 (they also run CPU-only); CPU wheels on Windows ARM64,
# which PyPI doesn't publish; plain PyPI elsewhere (e.g. macOS) ------------------------------
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "(sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')" },
    { index = "pytorch-cpu", marker = "sys_platform == 'win32' and platform_machine == 'ARM64'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# --- pytest ---------------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]  # "." so `bench` is importable from tests
markers = [
    "gpu: needs CUDA",
    "slow: takes more than 30 s",
    "model: downloads model weights",
]
